<section id="passwordPage" class="page">
  <h2>GANTI PASSWORD</h2>
  <form id="passwordForm" class="compact-form password-form">
    <label>Password Lama<input id="oldPassword" type="password" required></label>
    <label>Password Baru<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label>
    <label>Ulangi Password Baru<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label>
    <div class="form-buttons"><button class="button green">Simpan Password</button></div>
  </form>
</section>
